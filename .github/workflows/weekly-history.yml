name: Weekly refresh and Gazette

# Pulls the season in progress from Sleeper, imports it, and writes that week's
# edition of The FantasyWorld Gazette. Every Tuesday.
#
# ## Why Tuesday, and what it costs
#
# This ran on Wednesday until the Gazette existed, for a good reason that has not
# stopped being true: the NFL week finishes Monday night and stat corrections
# settle through Tuesday, so pulling now means importing scores that are still
# moving.
#
# That is a deliberate trade. A recap is worth reading while the week is still
# worth talking about, and Tuesday noon Eastern also lands it before Wednesday
# waivers, when it is actually useful.
#
# The mitigation is that **every Gazette issue snapshots the exact fact pack it
# was written from**, and the page renders its tables from that snapshot rather
# than from a live query. So the prose and the figures beside it are provably
# consistent with what was known at press time, and a correction that arrives on
# Thursday is next week's joke rather than this week's bug. The history pages
# themselves self-heal: the importer rewrites the season wholesale every run.
#
# ## Why a GitHub Action rather than a Vercel cron
#
# The import reads *committed* files: `history:pull` writes Sleeper's raw
# responses to `data/sleeper/<season>/` with a sha256 manifest, and the importer
# verifies that manifest before it opens a database connection. That model is
# what makes every import reproducible and reviewable — you can see in a diff
# exactly what the API said that week.
#
# A Vercel cron cannot commit to the repo, so it would have to fetch and write
# straight to Postgres, skipping the artifact. This runner can do both, and it
# runs the same two scripts that were tested locally rather than a third code
# path that only exists in production.
#
# It also keeps the scheduler out of the app entirely: nothing here touches the
# 400ms polling path that runs the draft.
#
# ## Setup
#
#   Settings → Secrets and variables → Actions → New repository secret
#     DATABASE_URL        = the Neon connection string
#     ANTHROPIC_API_KEY   = an Anthropic API key, for the Gazette
#     AI_GATEWAY_API_KEY  = a Vercel AI Gateway key, for the issue's artwork
#     GMAIL_USER          = the sending Gmail address
#     GMAIL_APP_PASSWORD  = a Gmail APP PASSWORD, not the account password
#     GAZETTE_MAIL_TO     = comma-separated recipients
#
# Without DATABASE_URL the job fails loudly on the first step rather than
# silently importing nothing. Without ANTHROPIC_API_KEY it warns and skips the
# newsletter — see the note on that step. Without AI_GATEWAY_API_KEY the issue
# is written and simply runs without a picture, which is the normal case for
# every issue in the archive older than the art step. Without the Gmail secrets
# the issue is published and nobody is told, which warns.
#
# ⚠️ **Gmail needs an app password and will not accept the account password.**
# Turn on 2-Step Verification, then Google Account → Security → App passwords.
# The value is a 16-character string; store it with the spaces stripped. It is
# revocable on its own, and it is invalidated when the account password changes
# — which is the most likely reason this step starts failing months from now.
#
# ⚠️ An app password grants SMTP send on that whole account. A dedicated Gmail
# account for the paper is worth the five minutes if the alternative is a
# personal one.
#
# ⚠️ GAZETTE_MAIL_TO is a secret rather than a file in the repository because it
# is ten real people's email addresses. They ride in Bcc so a send does not
# publish the league to itself.

on:
  schedule:
    # 16:00 UTC Tuesday — noon Eastern through the season, 11am once the clocks
    # go back in November. The NFL season runs almost entirely in EDT.
    - cron: '0 16 * * 2'
  # So it can be run by hand mid-week, and to test it without waiting.
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to refresh (defaults to the current one)'
        required: false
        type: string

concurrency:
  # Two refreshes writing the same season would race on the data files.
  group: history-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: pull and import
    runs-on: ubuntu-latest
    permissions:
      # To commit the refreshed snapshot back.
      contents: write

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Refresh the season
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — nothing would be imported."
            exit 1
          fi
          npx tsx scripts/history/refresh-season.ts \
            ${{ inputs.season && format('--season {0}', inputs.season) || '' }}

      # Which week this run owes, asked BEFORE the key is needed.
      #
      # ⚠️ Without this the missing-key path is indistinguishable from a quiet
      # week: the step below warns and exits zero so a dead key cannot strand
      # the Sleeper files, which leaves the run green having published nothing.
      # Out of season that is correct and desirable. During the season it is the
      # exact silence the reporting step at the end exists to break, and the
      # workflow cannot tell the two apart without asking something that does
      # not itself need the key.
      - name: What is owed
        id: owed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          week=$(npx tsx scripts/history/gazette.ts --check \
            ${{ inputs.season && inputs.season || '' }})
          echo "Owed: $week"
          echo "week=$week" >> "$GITHUB_OUTPUT"

      # Between the import and the commit, deliberately: the script writes
      # data/history/gazette/<season>.json, and the commit step below is what
      # gets that into the repo.
      #
      # ⚠️ This step warns rather than failing, and carries continue-on-error.
      # The import is the load-bearing job; the newsletter is not. A hard failure
      # here would stop the workflow before "Commit the snapshot", stranding the
      # Sleeper files that were just pulled and making next week's diff
      # incoherent. A genuine API failure still shows as a failed step in the
      # Actions UI, which is the visibility we actually want.
      - name: Write the Gazette
        id: gazette
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set — no issue written this week."
            # Recorded rather than acted on here: failing now would skip the
            # commit and strand the pull. The reporting step decides, and only
            # treats it as fatal when a week was actually owed.
            echo "nokey=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx tsx scripts/history/gazette.ts \
            ${{ inputs.season && inputs.season || '' }}

      # ⚠️ Same posture as the step above, and for a stronger reason: art is the
      # least load-bearing artifact in the repo. Null art is the NORMAL case —
      # every issue written before this step existed has none, and the front page
      # simply runs the headline without a picture. A failed image provider must
      # never cost the league its newsletter, let alone its Sleeper snapshot.
      #
      # ⚠️ `--latest`, NOT `--all`, and that is a cost decision rather than a
      # detail. `--all` illustrates every issue on record that has no picture,
      # which self-heals a failed image but also re-attempts the whole
      # un-illustrated back catalogue on every run — the nine 2025 issues
      # written before this script existed would be nine image generations every
      # Tuesday, forever, for issues nobody is waiting on.
      #
      # `--latest` takes the newest issue and stops, so a scheduled run costs
      # exactly one image. It needs no argument and so never has to agree with
      # the step above about which week was just written. Re-running is safe:
      # an issue that already has a picture is skipped.
      #
      # The trade is that a failed image is not retried. Null art is the normal
      # case — the front page runs the headline without a picture — so that is
      # cheap. Clear a backlog deliberately with `npm run gazette:art -- --all`.
      - name: Illustrate the issue
        id: art
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::No gateway or Anthropic key — this issue runs without a picture."
            exit 0
          fi
          npx tsx scripts/history/gazette-art.ts --latest

      - name: Commit the snapshot
        run: |
          # `public/gazette/` as well as `data/`: the art is a committed artifact
          # read off disk by `issueArt()`, exactly like every other source here.
          # Leaving it out would generate a picture every Tuesday and throw it
          # away when the runner terminated.
          if git diff --quiet -- data/ public/gazette/; then
            echo "No change in the pulled data — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/gazette/
          git commit -m "Weekly history refresh

          Sleeper snapshot for the season in progress, pulled and imported by
          .github/workflows/weekly-history.yml, alongside that week's Gazette
          issue. Data only — no code changes."
          git push

      # Tell ten people the paper exists.
      #
      # The whole pipeline publishes at noon into a git repository, which nobody
      # is watching. Without this the newsletter depends on ten men
      # independently remembering to open a website on a Tuesday, which is the
      # failure every internal publication actually dies of.
      #
      # ⚠️ Guarded on `steps.owed.outputs.week`, not on the gazette step
      # succeeding. That step exits zero when there was nothing to write, which
      # is most Tuesdays of the year — mailing on success alone would send a
      # "new issue" every week of the offseason pointing at a months-old
      # edition. It sends only when a week was genuinely owed and then written.
      #
      # ⚠️ `continue-on-error`, like the two model steps: a bounced email must
      # never cost the league its Sleeper snapshot. The issue is published
      # either way; this is a notification, not the product.
      #
      # Composed by a script that has the database and no credentials, sent by
      # curl which has credentials and no database. The message is written to
      # RUNNER_TEMP rather than the workspace so ten people's addresses cannot
      # wander into a commit.
      #
      # Setup: Gmail requires an APP PASSWORD (2FA on the account, then
      # Google Account → Security → App passwords). A normal password will not
      # authenticate. Secrets: GMAIL_USER, GMAIL_APP_PASSWORD, GAZETTE_MAIL_TO
      # (comma-separated). Recipients ride in Bcc so the league is not published
      # to itself on every send.
      - name: Email the league
        id: mail
        if: steps.owed.outputs.week != 'none' && steps.gazette.outcome == 'success'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GAZETTE_MAIL_FROM: ${{ secrets.GMAIL_USER }}
          GAZETTE_MAIL_TO: ${{ secrets.GAZETTE_MAIL_TO }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OWED: ${{ steps.owed.outputs.week }}
        run: |
          if [ -z "$GMAIL_USER" ] || [ -z "$GMAIL_APP_PASSWORD" ] || [ -z "$GAZETTE_MAIL_TO" ]; then
            echo "::warning::Gmail secrets are not set — the issue was published but nobody was told."
            exit 0
          fi

          MSG="$RUNNER_TEMP/gazette-mail.txt"
          npx tsx scripts/history/notify-email.ts \
            ${{ inputs.season && inputs.season || '' }} "$OWED" --out "$MSG"
          # The script exits 0 having written nothing when the issue is not
          # there, which is the same "nothing to say" case as everywhere else.
          if [ ! -s "$MSG" ]; then
            echo "No message composed — nothing to send."
            exit 0
          fi

          # One --mail-rcpt per address: Bcc is a header, and the SMTP envelope
          # has to name every recipient separately or only the first is served.
          RCPT=()
          IFS=',' read -ra ADDRS <<< "$GAZETTE_MAIL_TO"
          for a in "${ADDRS[@]}"; do
            trimmed="$(echo "$a" | xargs)"
            [ -n "$trimmed" ] && RCPT+=(--mail-rcpt "$trimmed")
          done

          curl --silent --show-error --ssl-reqd \
            --url "smtps://smtp.gmail.com:465" \
            --mail-from "$GMAIL_USER" \
            "${RCPT[@]}" \
            --user "$GMAIL_USER:$GMAIL_APP_PASSWORD" \
            --upload-file "$MSG"
          echo "Sent to ${#RCPT[@]} recipient(s)."

      # ⚠️ This is what stops a missed edition being silent, and it has to run
      # AFTER the commit rather than instead of it.
      #
      # The two steps above carry `continue-on-error` so that a dead model
      # provider cannot strand the Sleeper files that were just pulled. The cost
      # of that, until this step existed, was a GREEN tick on a week that
      # published nothing: the only trace was a collapsed step in a UI nobody
      # opens on a Tuesday, so the failure surfaced whenever somebody next
      # wondered why the paper had stopped.
      #
      # Failing the job here restores the signal without touching the commit —
      # GitHub emails the repository owner when a SCHEDULED run fails, which for
      # a weekly newsletter is the whole notification system. The recovery is
      # already automatic: `nextIssueWeek` resumes from the last issue on record,
      # so the missed week is retried on the next run rather than skipped.
      # This step exists so somebody knows to look before then.
      - name: Report what did not get written
        if: >-
          steps.gazette.outcome == 'failure' || steps.art.outcome == 'failure'
          || steps.gazette.outputs.nokey == 'true' || steps.mail.outcome == 'failure'
        env:
          OWED: ${{ steps.owed.outputs.week }}
          NOKEY: ${{ steps.gazette.outputs.nokey }}
          GAZETTE: ${{ steps.gazette.outcome }}
          ART: ${{ steps.art.outcome }}
          MAIL: ${{ steps.mail.outcome }}
        run: |
          {
            echo "### The weekly run did not finish cleanly"
            echo
            echo "The Sleeper pull and import succeeded and have been committed."
            echo "Week owed at the start of this run: \`$OWED\`."
            echo
            if [ "$GAZETTE" = "failure" ]; then
              echo "- ❌ **The Gazette issue was not written.** It will be retried on the"
              echo "  next run, which resumes from the last issue on record."
            fi
            if [ "$NOKEY" = "true" ]; then
              echo "- ❌ **ANTHROPIC_API_KEY is not set**, so no issue could be written."
              echo "  Settings → Secrets and variables → Actions."
            fi
            if [ "$ART" = "failure" ]; then
              echo "- ⚠️ **The artwork failed.** An issue with no picture is the normal"
              echo "  case, not a fault."
            fi
            if [ "$MAIL" = "failure" ]; then
              echo "- ⚠️ **The email did not go out.** The issue is published and readable;"
              echo "  nobody was told about it. Check the Gmail app password has not been"
              echo "  revoked — they expire when the account password changes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Art alone is never worth a red run -- null art is normal, and the
          # front page just runs the headline. A missing ISSUE is.
          if [ "$GAZETTE" = "failure" ]; then
            echo "::error::The Gazette issue was not written this week."
            exit 1
          fi

          # A missing key only matters if there was something to write. Out of
          # season this fires 40-odd Tuesdays running and a workflow that is red
          # every week is a workflow nobody reads -- which is how the real one
          # gets missed.
          if [ "$NOKEY" = "true" ] && [ "$OWED" != "none" ]; then
            echo "::error::Week $OWED was owed and ANTHROPIC_API_KEY is not set."
            exit 1
          fi
